name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Get version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then EXT=".exe"; fi
          OUTPUT="babylon-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          go build \
            -ldflags="-X 'main.version=${{ steps.version.outputs.VERSION }}' -X 'main.buildCommit=${{ github.sha }}' -X 'main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o "build/${OUTPUT}" .
          cd build && sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: babylon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/babylon-*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: artifacts/babylon-*

      - name: Compute checksums
        id: checksums
        run: |
          echo "DARWIN_ARM64_SHA256=$(cat artifacts/babylon-darwin-arm64.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "DARWIN_AMD64_SHA256=$(cat artifacts/babylon-darwin-amd64.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "LINUX_AMD64_SHA256=$(cat artifacts/babylon-linux-amd64.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "LINUX_ARM64_SHA256=$(cat artifacts/babylon-linux-arm64.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        uses: actions/checkout@v5
        with:
          repository: jet-ski/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Write formula
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cat > homebrew-tap/Formula/babylon.rb << 'FORMULA'
          class Babylon < Formula
            desc "CLI for Red Hat Demo Platform (demo.redhat.com)"
            homepage "https://github.com/jet-ski/redhat-babylon-cli"
            version "${{ steps.version.outputs.VERSION }}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/jet-ski/redhat-babylon-cli/releases/download/${{ steps.version.outputs.VERSION }}/babylon-darwin-arm64"
                sha256 "${{ steps.checksums.outputs.DARWIN_ARM64_SHA256 }}"
              end
              on_intel do
                url "https://github.com/jet-ski/redhat-babylon-cli/releases/download/${{ steps.version.outputs.VERSION }}/babylon-darwin-amd64"
                sha256 "${{ steps.checksums.outputs.DARWIN_AMD64_SHA256 }}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/jet-ski/redhat-babylon-cli/releases/download/${{ steps.version.outputs.VERSION }}/babylon-linux-arm64"
                sha256 "${{ steps.checksums.outputs.LINUX_ARM64_SHA256 }}"
              end
              on_intel do
                url "https://github.com/jet-ski/redhat-babylon-cli/releases/download/${{ steps.version.outputs.VERSION }}/babylon-linux-amd64"
                sha256 "${{ steps.checksums.outputs.LINUX_AMD64_SHA256 }}"
              end
            end

            def install
              binary = Dir["babylon-*"].first || "babylon"
              bin.install binary => "babylon"
            end

            test do
              assert_match "babylon", shell_output("#{bin}/babylon version")
            end
          end
          FORMULA

      - name: Push formula update
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/babylon.rb
          git commit -m "babylon ${{ steps.version.outputs.VERSION }}"
          git push
